name: theme-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # コントラスト検査 + .vscode/settings.json のテーマ登録漏れ検出（Chrome不要）
      - run: npm run theme-check
